<!-- =====================================================================
     HISD animated Ribbon — Power Pages (Dataverse portal) embed
     ---------------------------------------------------------------------
     COPY-PASTE, CSP-SAFE snippet. Paste the marked block into a Web
     Template, Content Snippet (type Text/HTML), or directly into a page's
     HTML. Full upload + CSP notes are in ribbon-embed.md (same folder).

     What it renders:
       - ALWAYS: the canonical HISD Ribbon as a static SVG floor (rung 0).
       - ON A CAPABLE CLIENT: the <hisd-ribbon> web component upgrades it
         to a live, slowly-flowing WebGL2 fill (rung 2), overlaid on the
         same silhouette. It auto-degrades to the CSS sheen / static SVG
         under reduced-motion, forced-colors, save-data, weak devices, no
         WebGL2, or a strict portal CSP that blocks the module.

     The element is DECORATIVE: host carries role="presentation"; the inner
     SVG is aria-hidden. Do not put meaning here that isn't also in text.
     ===================================================================== -->

<!-- ▼▼▼  BEGIN copy-paste block  ▼▼▼ -->

<!-- 1) Theme tokens + Ribbon component styles, as portal web files.
        Load AFTER the portal's Bootstrap so HISD tokens win the cascade.
        (If you already load hisd-powerpages.css site-wide for the theme,
        these two are still required for the Ribbon device + its fallbacks.) -->
<link rel="stylesheet" href="/hisd-theme.css">
<link rel="stylesheet" href="/ribbon.css">

<!-- 2) The Ribbon. The custom element renders the static SVG floor itself,
        then — because of the `animate` attribute — mounts the WebGL core when
        the client is capable. WITHOUT `animate` it stays a still SVG.
        - animate: opt in to motion (WebGL on capable clients, else CSS sheen).
        - intensity: 0..1 (default 0.6). Lower = subtle drift, higher = flow.
        - tier: "auto" (default) | "css" (never WebGL) | "webgl" (force-try).
        - The element is decorative; no aria/label needed (it self-hides). -->
<hisd-ribbon animate intensity="0.6"></hisd-ribbon>

<!-- 2b) FAN DIVIDER variant (thin divider, no animated fill needed):
     <hisd-ribbon variant="fan"></hisd-ribbon>
     2c) Force the CSS tier (no WebGL) but still moving:
     <hisd-ribbon animate tier="css"></hisd-ribbon> -->

<!-- 3) Register the element as a normal ES module web file.
        No inline eval, no remote CDN — this is what makes it CSP-safe.
        Place once per page (or in the base layout, before </body>).
        defer is implicit for type="module". If a strict CSP blocks this
        module, nothing breaks: the static SVG floor above is already on
        screen and simply stays. -->
<script type="module" src="/hisd-ribbon.js"></script>

<!-- ▲▲▲  END copy-paste block  ▲▲▲ -->


<!-- =====================================================================
     SIZING (optional)
     ---------------------------------------------------------------------
     The Ribbon holds the canonical 640:240 aspect ratio. Set a width (or
     --hisd-ribbon-h) on the element; height follows. Example as a full-
     bleed banner strip under a page header:
     ===================================================================== -->
<style>
  /* scope to your page; uses tokens already defined by hisd-theme.css */
  .hisd-ribbon-banner { display: block; width: 100%; max-width: 100%; }
</style>
<hisd-ribbon class="hisd-ribbon-banner" animate intensity="0.5"></hisd-ribbon>

     only with a fresh UID per instance.
     ===================================================================== -->
