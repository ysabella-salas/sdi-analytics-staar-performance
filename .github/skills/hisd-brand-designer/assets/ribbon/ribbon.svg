<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240"
     role="img" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
  <title>HISD Ribbon</title>
  <desc>HISD's signature "bayou" curve device — the PRIMARY ribbon recipe. Themeable
        flowing band that fills with the --ribbon-gradient (teal -&gt; dark-green). The
        bezier geometry matches platforms/social/og.svg so the canonical shape is one
        shape everywhere. Decorative only: role="img" + aria-hidden, host with alt=""
        / role="presentation". Hardcoded hex equals the canonical light-theme stops so
        the file renders standalone in print/email/no-CSS contexts.</desc>
  <defs>
    <!-- PRIMARY recipe: var(ribbon-gradient) = linear-gradient(105deg, from 0%, to 100%).
         105deg in CSS maps to a left-to-right sweep angled slightly downward; here a
         near-horizontal vector approximates it for the SVG. Stops reference the live
         theme custom properties with canonical-hex fallbacks (light: teal-500 to
         dark-green-600). Swap data-theme on a CSS ancestor to retheme without a JS
         asset swap. -->
    <linearGradient id="hisdRibbonGradient" x1="0" y1="0.15" x2="1" y2="0.85">
      <stop offset="0"   stop-color="var(--ribbon-from, #00A3AF)"/>
      <stop offset="1"   stop-color="var(--ribbon-to, #026252)"/>
    </linearGradient>
    <!-- Optional peak highlight: var(ribbon-highlight) (yellow-400). -->
    <linearGradient id="hisdRibbonHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="var(--ribbon-highlight, #FBDE83)" stop-opacity="0"/>
      <stop offset="0.5" stop-color="var(--ribbon-highlight, #FBDE83)" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="var(--ribbon-highlight, #FBDE83)" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Flowing bayou band. Geometry reuses the stacked-bezier wave shipped in
       platforms/social/og.svg so the canonical ribbon is the same curve everywhere. -->
  <path d="M0,30.0 C192.0,0.0 448.0,60.0 640.0,30.0 L640.0,170.0 C448.0,200.0 192.0,140.0 0,170.0 Z"
        fill="url(#hisdRibbonGradient)"/>
  <!-- Optional thin highlight tracing the upper peak of the arc. -->
  <path d="M0,30.0 C192.0,0.0 448.0,60.0 640.0,30.0 L640.0,44.0 C448.0,74.0 192.0,14.0 0,44.0 Z"
        fill="url(#hisdRibbonHighlight)"/>
</svg>
